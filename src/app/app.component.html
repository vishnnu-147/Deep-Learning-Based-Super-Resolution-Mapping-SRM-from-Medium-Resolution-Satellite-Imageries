<div class="app-shell">
  <!-- Minimal Top Navigation Bar -->
  <app-navbar
    (openCopernicusModal)="showCopernicusModal.set(true)"
    (openModelDetails)="showModelModal.set(true)"
    (openHelpModal)="showHelpModal.set(true)"
    (openSettingsModal)="showSettingsModal.set(true)">
  </app-navbar>

  <!-- Routed Main Application Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Subtle Geospatial Footer -->
  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-left">
        <span class="f-brand">SATELLITE SUPER RESOLUTION</span>
        <span class="f-sep">·</span>
        <span class="f-desc">Sentinel-2 L2A Multispectral Processing (B02, B03, B04, B08)</span>
      </div>
      <div class="footer-right">
        <span class="f-notice">Estimated Detail: ~2.5 m</span>
        <span class="f-sep">·</span>
        <span class="f-engine">TensorFlow.js Engine</span>
      </div>
    </div>
  </footer>

  <!-- Modals -->
  <app-copernicus-modal
    *ngIf="showCopernicusModal()"
    (close)="showCopernicusModal.set(false)">
  </app-copernicus-modal>

  <app-model-details-modal
    *ngIf="showModelModal()"
    (close)="showModelModal.set(false)">
  </app-model-details-modal>

  <app-help-modal
    *ngIf="showHelpModal()"
    (close)="showHelpModal.set(false)">
  </app-help-modal>

  <app-settings-modal
    *ngIf="showSettingsModal()"
    (close)="showSettingsModal.set(false)">
  </app-settings-modal>
</div>
